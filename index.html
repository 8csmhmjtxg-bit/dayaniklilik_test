<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🍻 Davet</title>
  <style>
    * { box-sizing: border-box; }
    body{
      min-height:100vh;
      margin:0;
      display:grid;
      place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #fdfbfb, #ebedee);
      color:#111;
      padding:16px;
    }
    .card{
      width:min(520px, 96vw);
      background:#fff;
      border-radius:18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      overflow:hidden;
      text-align:center;
    }
    img{
      width:100%;
      aspect-ratio:16/10;
      object-fit:cover;
      display:block;
      background: rgba(0,0,0,0.04);
    }
    h1{
      margin: 20px 16px 18px;
      font-size: clamp(18px, 4.5vw, 26px);
      line-height: 1.15;
    }
    .buttons{
      position: relative;
      height: 110px;
      display:grid;
      place-items:center;
      padding-bottom: 22px;
    }
    .row{
      display:flex;
      gap:12px;
      justify-content:center;
      align-items:center;
      width:100%;
      max-width: 360px;
    }
    button{
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 650;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      min-width: 130px;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 120ms ease, filter 120ms ease;
    }
    button:active{ transform: translateY(1px) scale(0.99); }

    #yes{ background:#16a34a; color:#fff; }
    #yes:hover{ filter: brightness(1.05); }

    #no{
      background:#ef4444;
      color:#fff;
      position:absolute;
      left: 60%;
      top: 10px;
    }

    .hidden{ display:none; }

    .successText{
      padding: 22px 16px 26px;
      display:grid;
      gap:10px;
    }
    .successText h2{
      margin:0;
      font-size: clamp(18px, 4.2vw, 24px);
    }
    .successText p{
      margin:0;
      font-size: 15px;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <main class="card" id="screenQuestion">
    <img src="foto1.jpg" alt="Fotoğraf 1">
    <h1>Fatoh seni 2 bira içmeye davet ediyor</h1>

    <div class="buttons" id="btnArea">
      <div class="row">
        <button id="yes" type="button">Kabul et</button>
      </div>
      <button id="no" type="button">Reddet</button>
    </div>
  </main>

  <main class="card hidden" id="screenSuccess">
    <img src="foto2.jpg" alt="Fotoğraf 2">
    <div class="successText">
      <h2>🎉 Tebrikler doğru karar!</h2>
      <p>Hangi gün müsait olduğunuzu lütfen Fatihe bildirin.</p>
    </div>
  </main>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const btnArea = document.getElementById("btnArea");
    const screenQuestion = document.getElementById("screenQuestion");
    const screenSuccess = document.getElementById("screenSuccess");

    function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

    function moveNoButton(){
      const areaRect = btnArea.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = areaRect.width - btnRect.width;
      const maxY = areaRect.height - btnRect.height;

      const x = clamp(Math.random() * maxX, 0, maxX);
      const y = clamp(Math.random() * maxY, 0, maxY);

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
    }

    noBtn.addEventListener("mouseover", moveNoButton);

    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveNoButton();
    }, { passive: false });

    btnArea.addEventListener("mousemove", (e) => {
      const b = noBtn.getBoundingClientRect();
      const dx = (b.left + b.width/2) - e.clientX;
      const dy = (b.top + b.height/2) - e.clientY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if(dist < 90) moveNoButton();
    });

    yesBtn.addEventListener("click", () => {
      screenQuestion.classList.add("hidden");
      screenSuccess.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    window.addEventListener("load", moveNoButton);
  </script>

</body>
</html>
